server:
  addr: ":8080"

observe:
  service_name: "expenses"
  # Empty means no OTLP export. Set to "localhost:4317" when the goplatform
  # docker-compose observability stack is running.
  otlp_endpoint: ""

upload:
  max_size_mb: 20

receipts:
  # How often new receipts are pulled from the FNS archive in the
  # background. Go duration; "0" disables the scheduler.
  sync_interval: "6h"
