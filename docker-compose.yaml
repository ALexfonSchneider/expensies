# Full stack: the app and its Postgres.
#
#   docker compose up -d --build     # build the image and start everything
#   docker compose up -d postgres    # only the database, for `go run ./cmd`
#
# Postgres is published on 5433 so a locally running binary can reach it
# with the DSN from config/config.postgres.yaml; inside the network the
# app uses the service name.

services:
  app:
    build:
      context: .
    image: expenses:latest
    container_name: expenses-app
    environment:
      EXPENSES__POSTGRES__DSN: "postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable"
      # Empty disables telemetry export; point at an OTLP collector to enable.
      EXPENSES__OBSERVE__OTLP_ENDPOINT: ""
      EXPENSES__RECEIPTS__SYNC_INTERVAL: "6h"
      # Receipt timestamps and the "today" of budgets are Moscow time.
      TZ: "Europe/Moscow"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: expenses-postgres
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    ports:
      - "5433:5432"
    volumes:
      - expenses-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  expenses-pgdata:
